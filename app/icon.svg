<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0edff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Logo tile: light blue square with the brand initials -->
  <rect x="2" y="2" width="56" height="56" rx="13" fill="url(#tile)" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="29" y="40" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#1d4ed8">IN</text>
  <!-- PX badge in the bottom-right corner -->
  <circle cx="49" cy="49" r="13" fill="url(#badge)" stroke="#ffffff" stroke-width="2.5"/>
  <text x="49" y="53" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#ffffff">PX</text>
</svg>
